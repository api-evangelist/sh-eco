description: SH-ECO (翊科聚合物 / Yike Polymer) is a Chinese medical-device materials manufacturer
  specializing in the research, production, and customized fabrication of medical catheters
  and membrane materials. Its product range spans single-lumen tubing, multi-lumen tubing,
  composite/multi-layer tubing, and injection-molded components serving healthcare and
  multiple industrial applications. The company is a portfolio company of Qiming Venture
  Partners and was added to the API Evangelist network as a company profile. It publishes
  a corporate marketing website but exposes no public developer or API surface.
